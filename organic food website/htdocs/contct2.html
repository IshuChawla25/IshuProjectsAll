<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <style>
        .contact_info {
            font-family: 'Roboto', sans-serif;
            background-color: #f9f6f1;
            color: #5a3e2b;
            margin: 0;
            padding: 0;
            text-align: center;
        }
        .container {
            padding: 50px 20px;
        }
        h1 {
            font-size: 2em;
            font-weight: 700;
            margin-bottom: 20px;
        }
        p {
            font-size: 1.5em;
            font-weight: 400;
            margin-bottom: 40px;
        }
        .contact-info {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
        }
        .contact-item {
            flex: 1;
            min-width: 200px;
            max-width: 300px;
            padding: 20px;
            box-sizing: border-box;
        }
        .contact-item i {
            font-size: 2em;
            margin-bottom: 10px;
        }
        .contact-item h3 {
            font-size: 1.2em;
            font-weight: 700;
            margin-bottom: 10px;
        }
        .contact-item p {
            font-size: 1em;
            font-weight: 400;
            margin: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Get in touch</h1>
        <p>Tell us how you like our products, share ideas & help us make health more fun.</p>
        <div class="contact-info">
            <div class="contact-item">
                <i class="fas fa-map-marker-alt"></i>
                <h3>Address</h3>
                <p>119, Veena Beena Complex,<br>Gurunanak rd<br>Opp. Bandra Stn., Bandra (W),<br>Mumbai 400 050.</p>
            </div>
            <div class="contact-item">
                <i class="fas fa-phone-alt"></i>
                <h3>Support</h3>
                <p>+91-93202-99480</p>
            </div>
            <div class="contact-item">
                <i class="fas fa-envelope"></i>
                <h3>Email Us</h3>
                <p>info@jiwa.in</p>
            </div>
        </div>
    </div>
</body>
</html>
